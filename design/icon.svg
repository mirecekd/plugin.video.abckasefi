<?xml version="1.0" encoding="UTF-8"?>
<!-- design/icon.svg : ABCKASEFI add-on icon, full-bleed square in the Copper palette of www.mirecek.org -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9ddbc"/>
      <stop offset="1" stop-color="#c78f67"/>
    </linearGradient>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(120)">
      <rect width="1.2" height="12" fill="#ffffff" fill-opacity="0.03"/>
    </pattern>
  </defs>
  <!-- full-bleed graphite square: no margin, no rounded corners, like the other add-on icons -->
  <rect width="512" height="512" fill="#202323"/>
  <rect width="512" height="512" fill="url(#hatch)"/>

  <!-- film strip along the top and bottom edge -->
  <g fill="#303635">
    <rect x="0" y="0" width="512" height="56"/>
    <rect x="0" y="456" width="512" height="56"/>
  </g>
  <g fill="#202323">
    <g id="holes-top">
      <rect x="22"  y="18" width="28" height="20" rx="4"/>
      <rect x="86"  y="18" width="28" height="20" rx="4"/>
      <rect x="150" y="18" width="28" height="20" rx="4"/>
      <rect x="214" y="18" width="28" height="20" rx="4"/>
      <rect x="278" y="18" width="28" height="20" rx="4"/>
      <rect x="342" y="18" width="28" height="20" rx="4"/>
      <rect x="406" y="18" width="28" height="20" rx="4"/>
      <rect x="470" y="18" width="28" height="20" rx="4"/>
    </g>
    <use href="#holes-top" y="438"/>
  </g>
  <rect x="0" y="56" width="512" height="1.5" fill="#a47955"/>
  <rect x="0" y="454.5" width="512" height="1.5" fill="#a47955"/>

  <!-- copper tile with the letters -->
  <rect x="86" y="108" width="340" height="236" rx="16" fill="url(#copper)"/>
  <rect x="86" y="108" width="340" height="236" rx="16" fill="none" stroke="#e7ac80" stroke-opacity="0.35" stroke-width="14" transform="translate(0 0)"/>
  <text x="256" y="276" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="150" letter-spacing="-6" fill="#202323">A-Z</text>

  <!-- the name -->
  <rect x="86" y="368" width="340" height="3" fill="#e7ac80"/>
  <text x="256" y="428" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="46" letter-spacing="3" fill="#eee9e1">ABCKASEFI</text>
</svg>
