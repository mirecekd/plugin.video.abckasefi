<?xml version="1.0" encoding="UTF-8"?>
<!-- design/fanart.svg : ABCKASEFI add-on background, same Copper language as the icon -->
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9ddbc"/>
      <stop offset="1" stop-color="#c78f67"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#e7ac80" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e7ac80" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(120)">
      <rect width="1.2" height="14" fill="#ffffff" fill-opacity="0.025"/>
    </pattern>
    <pattern id="holes" width="96" height="84" patternUnits="userSpaceOnUse">
      <rect x="34" y="28" width="30" height="28" rx="5" fill="#202323"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="#202323"/>
  <rect width="1920" height="1080" fill="url(#hatch)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- film strips along the top and bottom edge -->
  <rect x="0" y="0" width="1920" height="84" fill="#303635"/>
  <rect x="0" y="0" width="1920" height="84" fill="url(#holes)"/>
  <rect x="0" y="84" width="1920" height="2" fill="#a47955"/>
  <rect x="0" y="996" width="1920" height="84" fill="#303635"/>
  <g transform="translate(0 996)"><rect width="1920" height="84" fill="url(#holes)"/></g>
  <rect x="0" y="994" width="1920" height="2" fill="#a47955"/>

  <!-- title -->
  <text x="960" y="470" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="210" letter-spacing="-8" fill="#eee9e1">ABCKASEFI</text>
  <rect x="660" y="520" width="600" height="4" fill="#e7ac80"/>
  <text x="960" y="600" text-anchor="middle" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700"
        font-size="46" letter-spacing="1" fill="#bdbcb5">ABeCedni KAtalog SErialu a FIlmu</text>

  <!-- the alphabet as copper tiles, two rows of 13 -->
  <g font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-weight="700" font-size="46" text-anchor="middle">
    <g fill="#303635" stroke="#a47955" stroke-width="2">
      <rect x="150" y="680" width="100" height="100" rx="10"/><rect x="274" y="680" width="100" height="100" rx="10"/>
      <rect x="398" y="680" width="100" height="100" rx="10"/><rect x="522" y="680" width="100" height="100" rx="10"/>
      <rect x="646" y="680" width="100" height="100" rx="10"/><rect x="770" y="680" width="100" height="100" rx="10"/>
      <rect x="894" y="680" width="100" height="100" rx="10"/><rect x="1018" y="680" width="100" height="100" rx="10"/>
      <rect x="1142" y="680" width="100" height="100" rx="10"/><rect x="1266" y="680" width="100" height="100" rx="10"/>
      <rect x="1390" y="680" width="100" height="100" rx="10"/><rect x="1514" y="680" width="100" height="100" rx="10"/>
      <rect x="1638" y="680" width="100" height="100" rx="10"/>
      <rect x="150" y="804" width="100" height="100" rx="10"/><rect x="274" y="804" width="100" height="100" rx="10"/>
      <rect x="398" y="804" width="100" height="100" rx="10"/><rect x="522" y="804" width="100" height="100" rx="10"/>
      <rect x="646" y="804" width="100" height="100" rx="10"/><rect x="770" y="804" width="100" height="100" rx="10"/>
      <rect x="894" y="804" width="100" height="100" rx="10"/><rect x="1018" y="804" width="100" height="100" rx="10"/>
      <rect x="1142" y="804" width="100" height="100" rx="10"/><rect x="1266" y="804" width="100" height="100" rx="10"/>
      <rect x="1390" y="804" width="100" height="100" rx="10"/><rect x="1514" y="804" width="100" height="100" rx="10"/>
      <rect x="1638" y="804" width="100" height="100" rx="10"/>
    </g>
    <g fill="#e7ac80">
      <text x="200" y="745">A</text><text x="324" y="745">B</text><text x="448" y="745">C</text><text x="572" y="745">D</text>
      <text x="696" y="745">E</text><text x="820" y="745">F</text><text x="944" y="745">G</text><text x="1068" y="745">H</text>
      <text x="1192" y="745">I</text><text x="1316" y="745">J</text><text x="1440" y="745">K</text><text x="1564" y="745">L</text>
      <text x="1688" y="745">M</text>
      <text x="200" y="869">N</text><text x="324" y="869">O</text><text x="448" y="869">P</text><text x="572" y="869">Q</text>
      <text x="696" y="869">R</text><text x="820" y="869">S</text><text x="944" y="869">T</text><text x="1068" y="869">U</text>
      <text x="1192" y="869">V</text><text x="1316" y="869">W</text><text x="1440" y="869">X</text><text x="1564" y="869">Y</text>
      <text x="1688" y="869">Z</text>
    </g>
  </g>
</svg>
